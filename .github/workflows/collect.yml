name: 梦幻金价采集

on:
  schedule:
    # 每小时 08 分、38 分各跑一次（错开整点高峰，避开 GitHub 调度延迟）
    - cron: '8,38 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 采集金价 + 刷新分析
        run: |
          python collector.py
          python analyze.py

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.jsonl data/dashboard_data.json
          if git diff --staged --quiet; then
            echo "无数据变化"
          else
            git commit -m "chore: update gold prices"
            git push
          fi
